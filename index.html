<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maria Kurian</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2f5d50; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151614; --fg: #ecece6; --muted: #9a9a92; --accent: #8cc4b0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px 16px;
    }
    main { max-width: 560px; }
    h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 .5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
    a:hover { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Maria Kurian.</h1>
    <p>Welcome to my corner of the web. This site is just getting started, so check back soon.</p>
    <a href="https://github.com/maria-kurian">Find me on GitHub →</a>
  </main>
</body>
</html>
